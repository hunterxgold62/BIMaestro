name: Viewer Xbox checks
on:
  push:
    branches: [ajout-manette-xbox]
  pull_request:
    paths: ['viewer-web/**', '.github/workflows/viewer-gamepad.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: viewer-web
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /viewer-web/
            /.sites/bimaestro-viewer-mep/.openai/hosting.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: viewer-web/package-lock.json
      - name: Restore the existing non-secret hosting manifest
        run: |
          mkdir -p .openai
          cp ../.sites/bimaestro-viewer-mep/.openai/hosting.json .openai/hosting.json
      - run: npm ci
      - run: npm run test:gamepad
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Install Chromium for controller integration checks
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Exercise the viewer with a simulated Xbox controller in Chromium
        run: |
          npm run dev -- --port 3000 --host 127.0.0.1 > /tmp/viewer-xbox-server.log 2>&1 &
          viewer_process=$!
          trap 'kill "$viewer_process" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/ > /dev/null; then break; fi
            sleep 1
          done
          if ! VIEWER_TEST_URL=http://localhost:3000 timeout 180s node scripts/test-gamepad-browser.mjs; then
            tail -100 /tmp/viewer-xbox-server.log
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xbox-browser-screenshots
          path: viewer-web/test-results/
          if-no-files-found: ignore
